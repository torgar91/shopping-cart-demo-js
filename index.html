<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Carpintería Mazarredo</title>
    <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Icons"/>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat&family=Roboto&display=swap" rel="stylesheet">
</head>
<body>
    <header> 
        <nav class="menu">
            <div class="logo">
                <img src="./assets/logo/CARPINTERIA.png" alt="logo-carpinteria">
            </div>
            <div class="carrito">
                <span class="material-icons">shopping_cart</span>
                <span id="contador-carrito" class="contador-carrito">0</span>
                <div id="resumen-carrito" class="resumen-carrito oculto"></div>
            </div>
        </nav>
    </header>

    <main>
        <section class="section__products">
            <div class="products">
                <img src="./assets/herramientas/Martillo.png" alt="" class="section__products__img">
                <p class="section__products__title">Martillo</p>
                <p class="section__products__price">12 €</p>
              
                <div class="control-cantidad">
                <button class="btn-add" aria-label="Añadir martillo al carrito" id="btn-add-martillo">
                  <span class="material-icons">add_shopping_cart</span>
                </button>

                <p id="contenedor-martillo"> cantidad: </p>

              
                <button class="btn-remove" aria-label="Quitar martillo del carrito" id="btn-remove-martillo">
                  <span class="material-icons">remove_shopping_cart</span>
                </button>
                </div>
              </div>

              <div class="products">
                <img src="./assets/herramientas/Brocha.png" alt="" class="section__products__img">
                <p class="section__products__title">Brocha</p>
                <p class="section__products__price">10 €</p>
              
                <div class="control-cantidad">
                <button class="btn-add" aria-label="Añadir brocha al carrito" id="btn-add-brocha">
                  <span class="material-icons">add_shopping_cart</span>
                </button>

                <p id="contenedor-brocha"> cantidad: </p>

              
                <button class="btn-remove" aria-label="Quitar brocha del carrito" id="btn-remove-brocha">
                  <span class="material-icons">remove_shopping_cart</span>
                </button>
                </div>
              </div>

              <div class="products">
                <img src="./assets/herramientas/Tronco.png" alt="" class="section__products__img">
                <p class="section__products__title">Tronco</p>
                <p class="section__products__price">15 €</p>

              <div class="control-cantidad">
                <button class="btn-add" aria-label="Añadir tronco al carrito" id="btn-add-tronco">
                  <span class="material-icons">add_shopping_cart</span>
                </button>

                <p id="contenedor-tronco"> cantidad: </p>

              
                <button class="btn-remove" aria-label="Quitar tronco del carrito" id="btn-remove-tronco">
                  <span class="material-icons">remove_shopping_cart</span>
                </button>
              </div>
              </div>

              <div class="products">
                <img src="./assets/herramientas/Llave.png" alt="" class="section__products__img">
                <p class="section__products__title">Llave</p>
                <p class="section__products__price">8 €</p>

              <div class="control-cantidad">
                <button class="btn-add" aria-label="Añadir llave al carrito" id="btn-add-llave">
                  <span class="material-icons">add_shopping_cart</span>
                </button>

                <p id="contenedor-llave"> cantidad: </p>

              
                <button class="btn-remove" aria-label="Quitar llave del carrito" id="btn-remove-llave">
                  <span class="material-icons">remove_shopping_cart</span>
                </button>
                </div>
              </div>
              
        </section>
    </main>

    <script src="./script.js"></script>
</body>
</html>
